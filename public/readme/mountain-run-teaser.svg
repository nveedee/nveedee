<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NVEDEE Mountain Run preview">
  <rect width="1200" height="520" fill="#0e0e0e"/>

  <!-- far slope -->
  <path d="M0 340 L300 220 L620 310 L940 190 L1200 260 L1200 520 L0 520 Z" fill="#1c1c1c"/>
  <!-- near slope -->
  <path d="M0 400 L260 280 L560 380 L860 240 L1200 330 L1200 520 L0 520 Z" fill="#141414"/>
  <!-- piste line -->
  <path d="M40 430 C 260 360, 480 420, 640 320 S 980 280, 1160 240"
        fill="none" stroke="#f5f4f1" stroke-width="2" stroke-dasharray="2 10" opacity="0.5"/>

  <!-- skier -->
  <g transform="translate(600,300)">
    <circle cx="0" cy="-38" r="9" fill="#f5f4f1"/>
    <path d="M0 -29 L-4 6 M0 -29 L14 -6 M-4 6 L-20 26 M-4 6 L10 30 M-16 -14 L16 -20"
          stroke="#f5f4f1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <line x1="-24" y1="30" x2="-34" y2="14" stroke="#e4322b" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="34" x2="24" y2="18" stroke="#e4322b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- gates -->
  <line x1="380" y1="360" x2="380" y2="300" stroke="#e4322b" stroke-width="4"/>
  <line x1="880" y1="270" x2="880" y2="210" stroke="#e4322b" stroke-width="4"/>

  <!-- HUD -->
  <text x="48" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#f5f4f1">NVEDEE MOUNTAIN RUN</text>
  <text x="48" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#86837a">A SMALL ALPINE GAME, PLAYED FOR REAL — NOT A GIF</text>

  <text x="1152" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#86837a" text-anchor="end">SPEED</text>
  <rect x="1032" y="44" width="120" height="6" fill="#2a2a2a"/>
  <rect x="1032" y="44" width="86" height="6" fill="#e4322b"/>

  <line x1="0" y1="470" x2="1200" y2="470" stroke="#2a2a2a" stroke-width="1"/>
  <text x="48" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#f5f4f1">▶&#160;&#160;PLAY MOUNTAIN RUN</text>
  <text x="1152" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#86837a" text-anchor="end">LEFT · BRAKE · RIGHT</text>
</svg>
